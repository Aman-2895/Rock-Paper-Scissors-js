<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rock Paper Scissors</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      color: #333;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 30px;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    .score {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-bottom: 40px;
    }

    .score div {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      width: 180px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }

    .score div:hover {
      transform: scale(1.05);
    }

    .score p {
      font-size: 48px;
      font-weight: bold;
      color: #4CAF50;
    }

    .score h2 {
      margin-top: 10px;
      font-size: 22px;
      color: #555;
    }

    .choices {
      margin: 30px 0;
    }

    .choices button {
      padding: 14px 28px;
      margin: 0 12px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .choices button:hover {
      background: #43a047;
      transform: translateY(-3px);
    }

    .choices button:active {
      background: #388E3C;
      transform: scale(0.97);
    }

    #result {
      margin-top: 30px;
      font-size: 24px;
      padding: 15px 30px;
      background-color: #ffffff;
      color: #333;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      display: inline-block;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    #computer-choice {
      margin-top: 15px;
      font-size: 20px;
      color: #fff;
    }

    .reset-btn {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #f44336;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .reset-btn:hover {
      background: #d32f2f;
      transform: translateY(-2px);
    }

    .reset-btn:active {
      transform: scale(0.97);
    }

  </style>
</head>
<body>

  <h1>Rock Paper Scissors</h1>

  <div class="score">
    <div class="your">
      <p id="user-score">0</p>
      <h2>You</h2>
    </div>
    <div class="computer">
      <p id="computer-score">0</p>
      <h2>Computer</h2>
    </div>
  </div>

  <div class="choices">
    <button onclick="playgame('rock')">🪨 Rock</button>
    <button onclick="playgame('paper')">📄 Paper</button>
    <button onclick="playgame('scissors')">✂️ Scissors</button>
  </div>

  <div id="result">Make your move!</div>
  <div id="computer-choice"></div>

  <button class="reset-btn" onclick="resetGame()">🔄 Reset Game</button>

  <script>
    let userscore = 0;
    let computerscore = 0;

    const userScoreEl = document.getElementById("user-score");
    const computerScoreEl = document.getElementById("computer-score");
    const resultEl = document.getElementById("result");
    const computerChoiceEl = document.getElementById("computer-choice");

    const gencompchoice = () => {
      const options = ["rock", "paper", "scissors"];
      const randomIdx = Math.floor(Math.random() * 3);
      return options[randomIdx];
    };

    const capitalize = (str) => str.charAt(0).toUpperCase() + str.slice(1);

    const getEmoji = (choice) => {
      if (choice === "rock") return "🪨";
      if (choice === "paper") return "📄";
      if (choice === "scissors") return "✂️";
    };

    const updateScores = () => {
      userScoreEl.textContent = userscore;
      computerScoreEl.textContent = computerscore;
    };

    const showResult = (message) => {
      resultEl.textContent = message;
    };

    const resetGame = () => {
      userscore = 0;
      computerscore = 0;
      updateScores();
      showResult("Game reset. Make your move!");
      computerChoiceEl.textContent = "";
    };

    const playgame = (userchoice) => {
      const computerchoice = gencompchoice();
      computerChoiceEl.textContent = `Computer chose: ${getEmoji(computerchoice)}`;

      if (userchoice === computerchoice) {
        showResult("It's a draw!");
        return;
      }

      let userwin = false;

      if (userchoice === "rock") {
        userwin = computerchoice === "scissors";
      } else if (userchoice === "paper") {
        userwin = computerchoice === "rock";
      } else if (userchoice === "scissors") {
        userwin = computerchoice === "paper";
      }

      if (userwin) {
        userscore++;
        showResult(`🎉 You win! ${capitalize(userchoice)} beats ${capitalize(computerchoice)}.`);
      } else {
        computerscore++;
        showResult(`💻 Computer wins! ${capitalize(computerchoice)} beats ${capitalize(userchoice)}.`);
      }

      updateScores();
    };
  </script>

</body>
</html>
